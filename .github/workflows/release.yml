name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Validate release version
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
      - name: Core and application checks
        run: |
          swift run CoreChecks
          bash scripts/check-app.sh
      - name: Build macOS app
        run: |
          bash scripts/build-app.sh
          ditto -c -k --sequesterRsrc --keepParent build/GHNotif.app "build/GHNotif-macos-$(uname -m).zip"
      - name: Smoke test packaged app
        run: |
          build/GHNotif.app/Contents/MacOS/GHNotif & pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::GHNotif.app exited during launch"
            exit 1
          fi
          kill "$pid"
      - name: Attest macOS packages
        if: ${{ !github.event.repository.private || vars.BUILD_PROVENANCE_ENABLED == 'true' }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: build/GHNotif-macos-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.runner }}
          path: build/GHNotif-macos-*.zip
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
      - name: Validate release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne "v$((Get-Content VERSION -Raw).Trim())") { throw "Tag/version mismatch" }
      - name: Core and UI checks
        shell: pwsh
        run: |
          dotnet run --project windows/GHNotif.Checks -c Release
          if ($LASTEXITCODE -ne 0) { throw "Core checks failed" }
          dotnet run --project windows/GHNotif.Windows.Checks -c Release
          if ($LASTEXITCODE -ne 0) { throw "UI checks failed" }
      - run: ./scripts/build-windows.ps1
      - run: ./scripts/build-windows.ps1 -Runtime win-arm64
      - name: Attest Windows packages
        if: ${{ !github.event.repository.private || vars.BUILD_PROVENANCE_ENABLED == 'true' }}
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: build/GHNotif-win-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: build/GHNotif-win-*.zip
          if-no-files-found: error
  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Warn about unavailable private-repository provenance
        if: ${{ github.event.repository.private && vars.BUILD_PROVENANCE_ENABLED != 'true' }}
        run: echo "::warning::No build attestations generated. Private repositories require GitHub Enterprise Cloud and BUILD_PROVENANCE_ENABLED=true. Releases are not approved for broad distribution."
      - name: Publish release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum *.zip > SHA256SUMS
          arm_sha="$(sha256sum GHNotif-macos-arm64.zip | cut -d' ' -f1)"
          intel_sha="$(sha256sum GHNotif-macos-x86_64.zip | cut -d' ' -f1)"
          bash ../scripts/write-homebrew-cask.sh "${GITHUB_REF_NAME#v}" "$arm_sha" "$intel_sha" ghnotif.rb
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS ghnotif.rb \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "GHNotif $GITHUB_REF_NAME" --notes-file ../RELEASE-NOTES.md

  update-homebrew-tap:
    needs: publish
    if: ${{ vars.HOMEBREW_TAP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate tap configuration
        env:
          TAP_REPOSITORY: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
        run: |
          if [[ ! "$TAP_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Set HOMEBREW_TAP_REPOSITORY to the approved owner/repository before enabling tap sync."
            exit 1
          fi
      - name: Download the generated cask
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern ghnotif.rb
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update tap
        run: |
          mkdir -p tap/Casks
          cp ghnotif.rb tap/Casks/ghnotif.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/ghnotif.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update ghnotif to ${GITHUB_REF_NAME#v}"
          git push
