name: Windows
on:
  push:
    paths: ["windows/**", "assets/**", "scripts/build-windows.ps1", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "assets/**", "scripts/build-windows.ps1", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: Core tests
        run: dotnet run --project windows/GHNotif.Checks -c Release
      - name: Windows UI and DPAPI tests
        run: dotnet run --project windows/GHNotif.Windows.Checks -c Release
      - name: Upload UI preview (fictional data)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GHNotif-Windows-preview
          path: build/windows-*.png
          if-no-files-found: ignore
      - name: Build portable Windows x64 app
        run: ./scripts/build-windows.ps1
      - name: Build portable Windows ARM64 app
        run: ./scripts/build-windows.ps1 -Runtime win-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GHNotif-Windows
          path: build/GHNotif-win-*.zip
          if-no-files-found: error
